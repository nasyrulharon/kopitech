# Production stack for kopitech.my on a shared VPS (behind Cloudflare).
#
#   kopitech    — the site image, pulled from Docker Hub (built by GitHub Actions)
#   cloudflared — Cloudflare Tunnel; dials OUT to Cloudflare and serves kopitech.my.
#                 No inbound ports are opened, so it never conflicts with other
#                 sites on this VPS (e.g. koma-my on port 80). Cloudflare handles
#                 TLS / the certificate at its edge.
#   watchtower  — polls Docker Hub and redeploys kopitech when a new image is pushed
#
# Put these in a .env file next to this compose file:
#   DOCKERHUB_USERNAME=kopitech
#   DOCKERHUB_TOKEN=<docker hub token>          # to pull the private image
#   CLOUDFLARE_TUNNEL_TOKEN=<tunnel token>      # from the Cloudflare dashboard

services:
  kopitech:
    image: ${DOCKERHUB_USERNAME}/kopitech:latest
    container_name: kopitech
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - web
    depends_on:
      - kopitech

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true          # remove old images after update
      - WATCHTOWER_LABEL_ENABLE=true     # only touch containers with the enable label
      - WATCHTOWER_POLL_INTERVAL=120     # seconds between Docker Hub checks
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - TZ=Asia/Kuala_Lumpur
      # Credentials for pulling the private kopitech/kopitech image.
      # Values come from the .env file next to this compose file — never committed.
      - REPO_USER=${DOCKERHUB_USERNAME}
      - REPO_PASS=${DOCKERHUB_TOKEN}
    command: --label-enable --cleanup

networks:
  web:
